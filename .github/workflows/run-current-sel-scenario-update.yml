name: Run current SEL scenario update

on:
  push:
    paths:
      - '.github/workflows/run-current-sel-scenario-update.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scenario update
        run: python scripts/update_current_sel_scenarios.py
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish current SEL3 and SEL5 student scenarios"
          git push
