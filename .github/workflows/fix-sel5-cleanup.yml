name: Fix SEL5 cleanup adventure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'SEL5 三大情境收納冒險') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch SEL5 cleanup game
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div id="cleanup-items-layer" class="absolute inset-0"></div>\n            <div id="cleanup-zones-layer" class="absolute inset-0"></div>'
          new = '<div id="cleanup-scene-art" class="absolute inset-0 pointer-events-none z-0"></div>\n            <div id="cleanup-items-layer" class="absolute inset-0 z-10"></div>\n            <div id="cleanup-zones-layer" class="absolute inset-0 z-30"></div>'
          if old not in s: raise SystemExit('cleanup stage HTML anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('id="cleanup-pikmin-held-badge" class="absolute -top-6 left-1/2 -translate-x-1/2 text-2xl hidden animate-bounce"', 'id="cleanup-pikmin-held-badge" class="absolute top-8 left-1/2 -translate-x-1/2 text-xl hidden z-30 pointer-events-none drop-shadow-md"', 1)
          css_anchor = '    .animate-shake-cleanup {\n      animation: cleanupShake 0.4s ease-in-out;\n    }'
          css_add = '''    .animate-shake-cleanup { animation: cleanupShake 0.4s ease-in-out; }\n    #cleanup-stage { touch-action: manipulation; user-select: none; -webkit-user-select: none; }\n    #cleanup-scene-art { overflow: hidden; }\n    .cleanup-item-static { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }\n    .cleanup-scene-art-playground { background: radial-gradient(circle at 12% 18%, rgba(255,255,255,.75) 0 7%, transparent 8%), radial-gradient(circle at 78% 12%, rgba(255,255,255,.7) 0 6%, transparent 7%), linear-gradient(to bottom, #9ddcff 0 48%, #78c85b 49% 100%); }\n    .cleanup-scene-art-playground::after { content: '🏀   🛝        ⚽   🏃        🌳'; position:absolute; left:4%; right:4%; bottom:8%; font-size:clamp(28px,5vw,52px); letter-spacing:.18em; opacity:.7; white-space:nowrap; }\n    .cleanup-scene-art-classroom { background: linear-gradient(#dff2ff 0 58%, #d6b27a 59% 100%); }\n    .cleanup-scene-art-classroom::before { content:'▣  📚  🪟        🧑‍🏫        🪑 🪑 🪑'; position:absolute; left:5%; top:10%; right:5%; font-size:clamp(26px,4.5vw,48px); letter-spacing:.08em; opacity:.65; white-space:nowrap; }\n    .cleanup-scene-art-classroom::after { content:''; position:absolute; left:8%; right:8%; bottom:18%; height:18%; background:repeating-linear-gradient(90deg,rgba(120,72,35,.18) 0 9%,transparent 9% 18%); border-radius:18px; }\n    .cleanup-scene-art-bedroom { background: radial-gradient(circle at 78% 17%, #fff3a8 0 7%, transparent 8%), linear-gradient(#d9c8f5 0 62%, #c99367 63% 100%); }\n    .cleanup-scene-art-bedroom::before { content:'🖼️        🛏️  🧸        🚪'; position:absolute; left:6%; top:13%; right:6%; font-size:clamp(30px,5vw,54px); white-space:nowrap; opacity:.72; }\n    .cleanup-scene-art-bedroom::after { content:'▰ ▰ ▰'; position:absolute; right:9%; bottom:16%; font-size:clamp(34px,5vw,56px); opacity:.45; }\n    #cleanup-pikmin { touch-action:none; pointer-events:none; z-index:40; }'''
          if css_anchor not in s: raise SystemExit('cleanup CSS anchor not found')
          s = s.replace(css_anchor, css_add, 1)
          old_renderer = '''      if (sceneLabel) sceneLabel.innerHTML = `${scene.icon} ${scene.label}`;\n      if (stage) stage.className = `relative w-full h-[380px] rounded-3xl border-2 border-slate-200 overflow-hidden shadow-inner bg-gradient-to-br ${scene.bgClass}`;\n\n      const collected = cleanupCollectedItems[currentCleanupScene] || new Set();'''
          new_renderer = '''      if (sceneLabel) sceneLabel.innerHTML = `${scene.icon} ${scene.label}`;\n      if (stage) stage.className = 'relative w-full h-[380px] rounded-3xl border-2 border-slate-200 overflow-hidden shadow-inner bg-white';\n      const sceneArt = document.getElementById('cleanup-scene-art');\n      if (sceneArt) { sceneArt.className = `absolute inset-0 pointer-events-none z-0 cleanup-scene-art-${currentCleanupScene}`; sceneArt.setAttribute('aria-label', scene.label + '背景'); }\n\n      const collected = cleanupCollectedItems[currentCleanupScene] || new Set();'''
          if old_renderer not in s: raise SystemExit('cleanup renderer anchor not found')
          s = s.replace(old_renderer, new_renderer, 1)
          s = s.replace('class="absolute text-3xl sm:text-4xl leading-none drop-shadow hover:scale-125 active:scale-95 transition-transform duration-200 animate-bounce ${cleanupHeldItem === it.id ? \'invisible\' : \'\'}"', 'class="absolute text-3xl sm:text-4xl leading-none drop-shadow hover:scale-110 active:scale-95 transition-transform duration-150 cleanup-item-static ${cleanupHeldItem === it.id ? \'invisible\' : \'\'}"', 1)
          s = s.replace('transform: translate(-50%,-50%); animation-duration: 2s;', 'transform: translate(-50%,-50%);', 1)
          anchor = '    function handleCleanupItemClick(itemId) {'
          touch_fn = '''    function moveCleanupPikminToPercent(x, y, onArrive) {\n      const pikmin = document.getElementById('cleanup-pikmin');\n      if (!pikmin) return;\n      const clampedX = Math.max(5, Math.min(94, x));\n      const clampedY = Math.max(10, Math.min(91, y));\n      pikmin.style.left = clampedX + '%';\n      pikmin.style.top = clampedY + '%';\n      if (typeof onArrive === 'function') setTimeout(onArrive, 520);\n    }\n\n    function handleCleanupStagePointer(event) {\n      if (cleanupBusy || cleanupHeldItem) return;\n      const stage = document.getElementById('cleanup-stage');\n      if (!stage) return;\n      const target = event.target;\n      if (target.closest && (target.closest('button') || target.closest('#cleanup-pikmin'))) return;\n      const rect = stage.getBoundingClientRect();\n      const x = ((event.clientX - rect.left) / rect.width) * 100;\n      const y = ((event.clientY - rect.top) / rect.height) * 100;\n      const scene = CLEANUP_SCENES[currentCleanupScene];\n      const collected = cleanupCollectedItems[currentCleanupScene] || new Set();\n      const nearest = scene.items.filter(it => !collected.has(it.id)).map(it => ({it, d: Math.hypot(it.x-x,it.y-y)})).sort((a,b)=>a.d-b.d)[0];\n      if (nearest && nearest.d <= 8) { handleCleanupItemClick(nearest.it.id); return; }\n      playSound('pop');\n      moveCleanupPikminToPercent(x, y);\n      const hint = document.getElementById('cleanup-hint-text');\n      if (hint) hint.textContent = '👆 你可以再點一下物品，讓皮克敏走過去把它撿起來！';\n    }\n\n    function handleCleanupItemClick(itemId) {'''
          if anchor not in s: raise SystemExit('cleanup item handler anchor not found')
          s = s.replace(anchor, touch_fn, 1)
          s = s.replace("        pikmin.style.left = item.x + '%';\n        pikmin.style.top = item.y + '%';", "        moveCleanupPikminToPercent(item.x, item.y);", 1)
          s = s.replace("          pikmin.style.left = zone.x + '%';\n          pikmin.style.top = zone.y + '%';", "          moveCleanupPikminToPercent(zone.x, zone.y);", 1)
          init_anchor = '    function resetCleanupScene() {'
          bind_fn = '''    function initCleanupTouchControls() {\n      const stage = document.getElementById('cleanup-stage');\n      if (!stage || stage.dataset.touchBound === '1') return;\n      stage.dataset.touchBound = '1';\n      stage.addEventListener('pointerdown', handleCleanupStagePointer);\n    }\n\n    function resetCleanupScene() {'''
          if init_anchor not in s: raise SystemExit('cleanup reset anchor not found')
          s = s.replace(init_anchor, bind_fn, 1)
          s = s.replace("        switchCleanupScene(currentCleanupScene);\n      } else {", "        switchCleanupScene(currentCleanupScene);\n        initCleanupTouchControls();\n      } else {", 1)
          s = s.replace("      renderCleanupScene();\n    }\n\n    function renderCleanupScene() {", "      renderCleanupScene();\n      initCleanupTouchControls();\n    }\n\n    function renderCleanupScene() {", 1)
          marker = '<!-- SEL5_CLEANUP_FIX_20260914 -->'
          if marker not in s: s = s.replace('</body>', marker + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patched index.html
        shell: bash
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "修正 SEL5 三大情境收納冒險"
          git push
