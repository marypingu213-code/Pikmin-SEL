name: Fix SEL5 cleanup adventure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'SEL5 三大情境') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch SEL5 cleanup game
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Add a real illustrated scene layer behind objects/Pikmin.
          old = '<div id="cleanup-items-layer" class="absolute inset-0"></div>\n            <div id="cleanup-zones-layer" class="absolute inset-0"></div>'
          new = '<div id="cleanup-scene-art" class="absolute inset-0 pointer-events-none z-0"></div>\n            <div id="cleanup-items-layer" class="absolute inset-0 z-10"></div>\n            <div id="cleanup-zones-layer" class="absolute inset-0 z-30"></div>'
          if old not in s:
              raise SystemExit('cleanup stage HTML anchor not found')
          s = s.replace(old, new, 1)

          # 2) Make the held item visually sit in Pikmin\'s hands.
          s = s.replace('id="cleanup-pikmin-held-badge" class="absolute -top-6 left-1/2 -translate-x-1/2 text-2xl hidden animate-bounce"',
                        'id="cleanup-pikmin-held-badge" class="absolute top-8 left-1/2 -translate-x-1/2 text-xl hidden z-30 pointer-events-none drop-shadow-md"', 1)

          # 3) Add touch-friendly stage CSS and illustrated backgrounds.
          css_anchor = '    .animate-shake-cleanup {\n      animation: cleanupShake 0.4s ease-in-out;\n    }'
          css_add = '''    .animate-shake-cleanup {\n      animation: cleanupShake 0.4s ease-in-out;\n    }\n\n    /* SEL5 cleanup adventure: objects are intentionally STATIC; only Pikmin moves. */\n    #cleanup-stage {\n      touch-action: manipulation;\n      user-select: none;\n      -webkit-user-select: none;\n    }\n    #cleanup-scene-art {\n      overflow: hidden;\n    }\n    .cleanup-item-static {\n      cursor: pointer;\n      user-select: none;\n      -webkit-user-select: none;\n      touch-action: manipulation;\n    }\n    .cleanup-scene-art-playground {\n      background:\n        radial-gradient(circle at 12% 18%, rgba(255,255,255,.75) 0 7%, transparent 8%),\n        radial-gradient(circle at 78% 12%, rgba(255,255,255,.7) 0 6%, transparent 7%),\n        linear-gradient(to bottom, #9ddcff 0 48%, #78c85b 49% 100%);\n    }\n    .cleanup-scene-art-playground::after {\n      content: '🏀   🛝        ⚽   🏃        🌳';\n      position: absolute;\n      left: 4%; right: 4%; bottom: 8%;\n      font-size: clamp(28px, 5vw, 52px);\n      letter-spacing: .18em;\n      opacity: .7;\n      white-space: nowrap;\n    }\n    .cleanup-scene-art-classroom {\n      background:\n        linear-gradient(#dff2ff 0 58%, #d6b27a 59% 100%);\n    }\n    .cleanup-scene-art-classroom::before {\n      content: '▣  📚  🪟        🧑‍🏫        🪑 🪑 🪑';\n      position: absolute;\n      left: 5%; top: 10%;\n      right: 5%;\n      font-size: clamp(26px, 4.5vw, 48px);\n      letter-spacing: .08em;\n      opacity: .65;\n      white-space: nowrap;\n    }\n    .cleanup-scene-art-classroom::after {\n      content: '';\n      position: absolute;\n      left: 8%; right: 8%; bottom: 18%; height: 18%;\n      background: repeating-linear-gradient(90deg, rgba(120,72,35,.18) 0 9%, transparent 9% 18%);\n      border-radius: 18px;\n    }\n    .cleanup-scene-art-bedroom {\n      background:\n        radial-gradient(circle at 78% 17%, #fff3a8 0 7%, transparent 8%),\n        linear-gradient(#d9c8f5 0 62%, #c99367 63% 100%);\n    }\n    .cleanup-scene-art-bedroom::before {\n      content: '🖼️        🛏️  🧸        🚪';\n      position: absolute;\n      left: 6%; top: 13%; right: 6%;\n      font-size: clamp(30px, 5vw, 54px);\n      white-space: nowrap;\n      opacity: .72;\n    }\n    .cleanup-scene-art-bedroom::after {\n      content: '▰ ▰ ▰';\n      position: absolute;\n      right: 9%; bottom: 16%;\n      font-size: clamp(34px, 5vw, 56px);\n      opacity: .45;\n    }\n    #cleanup-pikmin {\n      touch-action: none;\n      pointer-events: none;\n      z-index: 40;\n    }'''
          if css_anchor not in s:
              raise SystemExit('cleanup CSS anchor not found')
          s = s.replace(css_anchor, css_add, 1)

          # 4) Replace the scene renderer so each scene gets an unmistakable visual environment.
          old_renderer = '''      if (sceneLabel) sceneLabel.innerHTML = `${scene.icon} ${scene.label}`;\n      if (stage) stage.className = `relative w-full h-[380px] rounded-3xl border-2 border-slate-200 overflow-hidden shadow-inner bg-gradient-to-br ${scene.bgClass}`;\n\n      const collected = cleanupCollectedItems[currentCleanupScene] || new Set();'''
          new_renderer = '''      if (sceneLabel) sceneLabel.innerHTML = `${scene.icon} ${scene.label}`;\n      if (stage) stage.className = 'relative w-full h-[380px] rounded-3xl border-2 border-slate-200 overflow-hidden shadow-inner bg-white';\n\n      const sceneArt = document.getElementById('cleanup-scene-art');\n      if (sceneArt) {\n        sceneArt.className = `absolute inset-0 pointer-events-none z-0 cleanup-scene-art-${currentCleanupScene}`;\n        sceneArt.setAttribute('aria-label', scene.label + '背景');\n      }\n\n      const collected = cleanupCollectedItems[currentCleanupScene] || new Set();'''
          if old_renderer not in s:
              raise SystemExit('cleanup renderer anchor not found')
          s = s.replace(old_renderer, new_renderer, 1)

          # 5) Remove the bouncing animation from every collectible item.
          s = s.replace('class="absolute text-3xl sm:text-4xl leading-none drop-shadow hover:scale-125 active:scale-95 transition-transform duration-200 animate-bounce ${cleanupHeldItem === it.id ? \'invisible\' : \'\'}"',
                        'class="absolute text-3xl sm:text-4xl leading-none drop-shadow hover:scale-110 active:scale-95 transition-transform duration-150 cleanup-item-static ${cleanupHeldItem === it.id ? \'invisible\' : \'\'}"', 1)
          s = s.replace('transform: translate(-50%,-50%); animation-duration: 2s;',
                        'transform: translate(-50%,-50%);', 1)

          # 6) Add tap-to-move interaction: tapping the stage moves Pikmin there.
          #    If the tap lands near an item, it is picked up after arrival.
          anchor = '''    function handleCleanupItemClick(itemId) {'''
          touch_fn = '''    function moveCleanupPikminToPercent(x, y, onArrive) {\n      const pikmin = document.getElementById('cleanup-pikmin');\n      if (!pikmin) return;\n      const clampedX = Math.max(5, Math.min(94, x));\n      const clampedY = Math.max(10, Math.min(91, y));\n      pikmin.style.left = clampedX + '%';\n      pikmin.style.top = clampedY + '%';\n      if (typeof onArrive === 'function') setTimeout(onArrive, 520);\n    }\n\n    function handleCleanupStagePointer(event) {\n      if (cleanupBusy) return;\n      const stage = document.getElementById('cleanup-stage');\n      if (!stage) return;\n      const target = event.target;\n      if (target.closest && (target.closest('button') || target.closest('#cleanup-pikmin'))) return;\n\n      const rect = stage.getBoundingClientRect();\n      const x = ((event.clientX - rect.left) / rect.width) * 100;\n      const y = ((event.clientY - rect.top) / rect.height) * 100;\n      const scene = CLEANUP_SCENES[currentCleanupScene];\n      const collected = cleanupCollectedItems[currentCleanupScene] || new Set();\n\n      if (cleanupHeldItem) return;\n\n      const nearest = scene.items\n        .filter(it => !collected.has(it.id))\n        .map(it => ({ it, d: Math.hypot(it.x - x, it.y - y) }))\n        .sort((a,b) => a.d - b.d)[0];\n\n      if (nearest && nearest.d <= 8) {\n        handleCleanupItemClick(nearest.it.id);\n        return;\n      }\n\n      playSound('pop');\n      moveCleanupPikminToPercent(x, y);\n      const hint = document.getElementById('cleanup-hint-text');\n      if (hint) hint.textContent = '👆 你可以再點一下物品，讓皮克敏走過去把它撿起來！';\n    }\n\n    function handleCleanupItemClick(itemId) {'''
          if anchor not in s:
              raise SystemExit('cleanup item handler anchor not found')
          s = s.replace(anchor, touch_fn, 1)

          # 7) Use the same movement helper when walking to an item/zone.
          s = s.replace("        pikmin.style.left = item.x + '%';\n        pikmin.style.top = item.y + '%';",
                        "        moveCleanupPikminToPercent(item.x, item.y);", 1)
          s = s.replace("          pikmin.style.left = zone.x + '%';\n          pikmin.style.top = zone.y + '%';",
                        "          moveCleanupPikminToPercent(zone.x, zone.y);", 1)

          # 8) Bind stage pointer events once, after the DOM exists.
          init_anchor = '''    function resetCleanupScene() {'''
          bind_fn = '''    function initCleanupTouchControls() {\n      const stage = document.getElementById('cleanup-stage');\n      if (!stage || stage.dataset.touchBound === '1') return;\n      stage.dataset.touchBound = '1';\n      stage.addEventListener('pointerdown', handleCleanupStagePointer);\n    }\n\n    function resetCleanupScene() {'''
          if init_anchor not in s:
              raise SystemExit('cleanup reset anchor not found')
          s = s.replace(init_anchor, bind_fn, 1)

          # Bind whenever cleanup mode is opened.
          s = s.replace("        switchCleanupScene(currentCleanupScene);\n      } else {",
                        "        switchCleanupScene(currentCleanupScene);\n        initCleanupTouchControls();\n      } else {", 1)

          # Also bind after initial DOM load if the tab is opened first.
          s = s.replace("      renderCleanupScene();\n    }\n\n    function renderCleanupScene() {",
                        "      renderCleanupScene();\n      initCleanupTouchControls();\n    }\n\n    function renderCleanupScene() {", 1)

          # 9) Stop the Pikmin itself from being affected by the stage pointer handler.
          s = s.replace('id="cleanup-pikmin" class="absolute w-14 h-16 transition-all duration-500 ease-in-out z-20"',
                        'id="cleanup-pikmin" class="absolute w-14 h-16 transition-all duration-500 ease-in-out z-40 pointer-events-none"', 1)

          marker = '<!-- SEL5_CLEANUP_FIX_20260914 -->'
          if marker not in s:
              s = s.replace('</body>', f'{marker}\n</body>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched index.html
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "修正 SEL5 三大情境收納冒險"
          git push
