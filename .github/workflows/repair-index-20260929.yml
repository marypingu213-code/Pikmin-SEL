name: Repair index syntax 20260929

on:
  push:
    paths:
      - '.github/workflows/repair-index-20260929.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair duplicated student filter block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          bad_start = """}{
      const sel = document.getElementById('student-filter-select');
      if (!sel) return;
      const studentNames = Array.from(new Set(growthHistoryRecords.map(r => r.name))).filter(Boolean);
      sel.innerHTML = '<option value=\"ALL\">🌟 全班所有學生手帳 (全部)</option>';
      studentNames.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = `👤 ${name}`;
        if (selectedStudentFilter === name) opt.selected = true;
        sel.appendChild(opt);
      });
      if (selectedStudentFilter === 'ALL') sel.value = 'ALL';
    }

    ffunction filterHistoryByStudent(studentId) {"""

          good = """}

    function filterHistoryByStudent(studentId) {"""

          if bad_start not in s:
              raise SystemExit('Safety stop: exact broken block not found; index.html unchanged')

          s = s.replace(bad_start, good, 1)

          if 'ffunction filterHistoryByStudent' in s:
              raise SystemExit('Safety stop: ffunction still present')
          if "}\n{\n      const sel = document.getElementById('student-filter-select');" in s:
              raise SystemExit('Safety stop: duplicated legacy block still present')

          p.write_text(s, encoding='utf-8')
          print('index.html syntax repair applied')
          PY
      - name: Verify repaired area
        run: |
          grep -q 'function updateStudentFilterDropdown()' index.html
          grep -q 'function filterHistoryByStudent(studentId)' index.html
          ! grep -q 'ffunction filterHistoryByStudent' index.html
          git diff --check
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair student filter syntax in index.html'
          git push
