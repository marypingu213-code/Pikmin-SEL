name: Upgrade SEL3 SEL5 and SEL journey
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch content
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='SEL3_SEL5_JOURNEY_UPGRADE_20260914'
          if marker in s: raise SystemExit(0)
          journey='''\n<!-- SEL3_SEL5_JOURNEY_UPGRADE_20260914 -->\n<div id="sel-journey-banner" class="hidden max-w-6xl mx-auto px-4 pt-3 pb-2"><div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-4"><div class="flex items-center justify-between gap-3 mb-3"><div><div class="text-sm font-black text-slate-500">我的 SEL 成長旅程</div><div id="sel-journey-title" class="text-xl font-black text-slate-800">認識自己</div></div><div id="sel-journey-step" class="text-sm font-black text-slate-500">1 / 5</div></div><div class="grid grid-cols-5 gap-1.5 text-center text-[11px] font-black"><div class="rounded-xl p-2 bg-red-50 text-red-700">① 認識自己</div><div class="rounded-xl p-2 bg-blue-50 text-blue-700">② 管理自己</div><div class="rounded-xl p-2 bg-green-50 text-green-700">③ 理解別人</div><div class="rounded-xl p-2 bg-yellow-50 text-yellow-700">④ 合作</div><div class="rounded-xl p-2 bg-purple-50 text-purple-700">⑤ 做決定</div></div></div></div>\n'''
          m=re.search(r'(<div[^>]+id=["\']tab-home["\'][^>]*>)',s,re.I)
          if not m: raise SystemExit('找不到主內容容器')
          s=s[:m.start()]+journey+s[m.start():]
          empathy='''\n<div id="sel3-empathy-upgrade" class="mt-6 bg-white rounded-3xl shadow-sm border border-emerald-100 p-5"><div class="text-2xl font-black text-emerald-800 mb-1">❤️ 真正的同理心：看見 → 猜想 → 問問看 → 行動</div><div class="text-sm text-slate-500 mb-4">不一定要猜對別人的心情；如果不確定，可以先問問看。</div><div class="grid md:grid-cols-4 gap-3"><div class="rounded-2xl bg-emerald-50 p-4"><b>① 看見</b><p class="text-sm">小明一個人坐在旁邊，沒有加入遊戲。</p></div><div class="rounded-2xl bg-sky-50 p-4"><b>② 猜想</b><p class="text-sm">他可能覺得孤單、害羞，或只是想休息。</p></div><div class="rounded-2xl bg-amber-50 p-4"><b>③ 問問看</b><p class="text-sm">「你還好嗎？要不要一起玩？」</p></div><div class="rounded-2xl bg-violet-50 p-4"><b>④ 行動</b><p class="text-sm">聽聽他的回答，再決定要怎麼幫忙。</p></div></div><div class="mt-4 p-4 rounded-2xl bg-slate-50 text-sm">🌱 <b>我不知道，可以問問看。</b> 這也是很好的同理心。</div></div>\n'''
          m=re.search(r'(<[^>]+id=["\']tab-empathy["\'][^>]*>)',s,re.I)
          if not m: raise SystemExit('找不到 SEL3')
          s=s[:m.end()]+empathy+s[m.end():]
          decision='''\n<div id="sel5-decision-upgrade" class="mt-6 bg-white rounded-3xl shadow-sm border border-purple-100 p-5"><div class="text-2xl font-black text-purple-800 mb-1">🧠 選擇有後果：我選了什麼 → 發生什麼 → 我可以重新想</div><div class="text-sm text-slate-500 mb-4">做錯不是失敗；看看結果，再想一次，就是負責任的決策。</div><div class="grid md:grid-cols-3 gap-3"><div class="rounded-2xl bg-purple-50 p-4"><b>① 我選了什麼？</b><p class="text-sm">把教室裡的東西收進正確的位置。</p></div><div class="rounded-2xl bg-orange-50 p-4"><b>② 發生什麼？</b><p class="text-sm">如果把別人的重要物品丟掉，教室雖乾淨，卻可能造成問題。</p></div><div class="rounded-2xl bg-green-50 p-4"><b>③ 再想一次</b><p class="text-sm">停一下、看看物品是誰的，再選更安全的做法。</p></div></div><div class="mt-4 flex flex-wrap gap-2"><span class="px-3 py-2 rounded-xl bg-slate-100 text-sm font-black">🔄 可以重新選</span><span class="px-3 py-2 rounded-xl bg-slate-100 text-sm font-black">👀 先觀察</span><span class="px-3 py-2 rounded-xl bg-slate-100 text-sm font-black">🤔 想想後果</span><span class="px-3 py-2 rounded-xl bg-slate-100 text-sm font-black">✅ 再行動</span></div></div>\n'''
          m=re.search(r'(<[^>]+id=["\']tab-organize["\'][^>]*>)',s,re.I)
          if not m: raise SystemExit('找不到 SEL5')
          s=s[:m.end()]+decision+s[m.end():]
          js='''\n<script>\n(function(){const map={'tab-self-card':['1','認識自己'],'tab-calm-down':['2','管理自己'],'tab-empathy':['3','理解別人'],'tab-teamwork':['4','合作'],'tab-organize':['5','做決定']};function u(){const b=document.getElementById('sel-journey-banner');if(!b)return;let a=null;Object.keys(map).some(id=>{const e=document.getElementById(id);if(e&&!e.classList.contains('hidden')){a=map[id];return true}return false});if(!a){b.classList.add('hidden');return}b.classList.remove('hidden');document.getElementById('sel-journey-step').textContent=a[0]+' / 5';document.getElementById('sel-journey-title').textContent=a[1]}new MutationObserver(u).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});document.addEventListener('click',()=>setTimeout(u,0));setTimeout(u,300)})();\n</script>\n'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "強化 SEL3 同理心、SEL5 決策與五關成長旅程" && git push
