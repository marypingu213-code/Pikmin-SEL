name: Final SEL3 four-column Pikmin scenarios
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append final SEL3 renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='SEL3_FINAL_FOUR_COLUMN_PIKMIN_20260914'
          if marker in s:
              raise SystemExit(0)

          css = r'''
<style id="sel3-final-four-column-css">
#sel3-final-board{width:100%;height:calc(100vh - 118px);min-height:620px;padding:10px 16px 14px;box-sizing:border-box;background:linear-gradient(180deg,#f0fdf4 0%,#ffffff 34%,#fff7ed 100%);overflow:hidden}
#sel3-final-board .sel3-topbar{display:flex;align-items:center;gap:14px;margin-bottom:8px}
#sel3-final-board .sel3-home-btn{flex:0 0 auto;border:0;border-radius:16px;background:#0f766e;color:white;font-weight:900;font-size:16px;padding:11px 16px;cursor:pointer;box-shadow:0 5px 12px rgba(15,118,110,.18)}
#sel3-final-board .sel3-scene-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:white;border:3px solid #86efac;border-radius:20px;padding:10px 16px;box-shadow:0 6px 16px rgba(15,23,42,.08)}
#sel3-final-board .sel3-pikmin-art{width:64px;height:76px;flex:0 0 64px}
#sel3-final-board .sel3-scene-text{min-width:0;text-align:left}
#sel3-final-board .sel3-scene-title{font-size:clamp(24px,2.6vw,36px);font-weight:1000;line-height:1.2;color:#14532d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sel3-final-board .sel3-scene-desc{font-size:clamp(15px,1.35vw,19px);font-weight:700;color:#475569;line-height:1.35;margin-top:4px}
#sel3-final-board .sel3-scene-count{flex:0 0 auto;font-size:15px;font-weight:900;color:#166534;background:#dcfce7;padding:8px 10px;border-radius:12px}

#sel3-final-board .sel3-steps-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:10px}
#sel3-final-board .sel3-step-head{height:92px;border:3px solid #cbd5e1;border-radius:18px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px 10px;box-sizing:border-box}
#sel3-final-board .sel3-step-head.active{border-color:#22c55e;background:#f0fdf4}
#sel3-final-board .sel3-step-head.done{border-color:#16a34a;background:#dcfce7}
#sel3-final-board .sel3-step-name{font-size:clamp(19px,1.8vw,26px);font-weight:1000;line-height:1.05;color:#0f172a}
#sel3-final-board .sel3-step-desc{font-size:clamp(12px,1.05vw,15px);font-weight:800;line-height:1.25;color:#64748b;margin-top:6px}

#sel3-final-board .sel3-columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;height:calc(100% - 206px);min-height:350px}
#sel3-final-board .sel3-column{border:3px solid #dbeafe;border-radius:22px;background:rgba(255,255,255,.96);padding:12px;box-sizing:border-box;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 6px 16px rgba(15,23,42,.06)}
#sel3-final-board .sel3-column.locked{opacity:.42;pointer-events:none;filter:saturate(.65)}
#sel3-final-board .sel3-question{font-size:clamp(16px,1.45vw,20px);font-weight:1000;color:#1e3a8a;line-height:1.28;margin-bottom:8px;min-height:44px;display:flex;align-items:center}
#sel3-final-board .sel3-options{display:flex;flex-direction:column;gap:8px;flex:1}
#sel3-final-board .sel3-option{width:100%;min-height:52px;border:3px solid #e2e8f0;border-radius:15px;background:#f8fafc;padding:8px 10px;text-align:left;font-size:clamp(13px,1.18vw,16px);font-weight:850;line-height:1.28;color:#1e293b;cursor:pointer;transition:.15s;display:flex;align-items:center}
#sel3-final-board .sel3-option:hover{border-color:#60a5fa;background:#eff6ff;transform:translateY(-1px)}
#sel3-final-board .sel3-option.selected.correct{border-color:#16a34a;background:#dcfce7;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
#sel3-final-board .sel3-option.selected.wrong{border-color:#f97316;background:#ffedd5;box-shadow:0 0 0 3px rgba(249,115,22,.12)}
#sel3-final-board .sel3-option:disabled{cursor:default;opacity:1}
#sel3-final-board .sel3-feedback{min-height:42px;margin-top:8px;border-radius:12px;padding:8px 10px;background:#f8fafc;border:2px dashed #cbd5e1;font-size:clamp(12px,1.05vw,14px);font-weight:850;line-height:1.3;color:#334155;display:flex;align-items:center}
#sel3-final-board .sel3-actions{position:absolute;right:26px;bottom:18px;display:flex;gap:10px;z-index:20}
#sel3-final-board .sel3-next{display:none;border:0;border-radius:16px;background:#7c3aed;color:white;font-weight:1000;font-size:17px;padding:12px 18px;cursor:pointer;box-shadow:0 7px 16px rgba(124,58,237,.22)}
#sel3-final-board .sel3-next.show{display:block}
#sel3-final-board .sel3-restart{border:0;border-radius:16px;background:#e2e8f0;color:#334155;font-weight:900;font-size:15px;padding:12px 15px;cursor:pointer}
#tab-empathy{position:relative}
@media(max-width:1050px){
  #sel3-final-board{height:auto;min-height:0;overflow:visible}
  #sel3-final-board .sel3-scene-title{white-space:normal}
  #sel3-final-board .sel3-steps-row,#sel3-final-board .sel3-columns{grid-template-columns:repeat(2,1fr);height:auto}
  #sel3-final-board .sel3-columns{min-height:0}
  #sel3-final-board .sel3-column{min-height:300px}
  #sel3-final-board .sel3-actions{position:static;justify-content:flex-end;margin-top:12px}
}
</style>
'''
          s=s.replace('</head>',css+'</head>',1)

          js = r'''
<!-- SEL3_FINAL_FOUR_COLUMN_PIKMIN_20260914 -->
<script>
(function(){
  const fallbackScenarios = [
    {title:'🔴 紅皮克敏遇到了小水坑！',svgKey:'red',desc:'紅皮克敏站在水坑邊發抖，需要夥伴先理解牠的害怕。',options:[
      {text:'請藍皮克敏陪牠走木橋繞過水坑',correct:true,note:'尊重弱點並善用夥伴優勢。'},
      {text:'直接把牠推進水坑',correct:false,note:'這會讓牠受到傷害。'},
      {text:'丟下牠自己回教室',correct:false,note:'忽略求助訊號不是好方法。'}
    ]}
  ];

  function getScenarios(){
    try{
      if(typeof EMPATHY_SCENARIOS!=='undefined' && Array.isArray(EMPATHY_SCENARIOS) && EMPATHY_SCENARIOS.length) return EMPATHY_SCENARIOS;
    }catch(e){}
    return fallbackScenarios;
  }

  let sceneIndex=0;

  function genericSteps(sc){
    return [
      {
        q:'① 看見：先找「真的看得到」的事情',
        opts:[
          ['先看牠現在的動作、位置和表情',true,'✓ 這是從看得到的線索開始。'],
          ['先把情境中的事實說清楚',true,'✓ 很好，先觀察再下判斷。'],
          ['牠一定是在故意找麻煩',false,'△ 這是在猜，不是直接看得到的事實。'],
          ['不用觀察，直接猜牠怎麼想',false,'△ 同理心的第一步是先看見。']
        ]
      },
      {
        q:'② 猜想：牠可能怎麼了？',
        opts:[
          ['牠可能有點不安或需要幫忙',true,'✓ 可以有這個可能。'],
          ['我還不確定，我想先問問看',true,'✓ 不知道也沒關係，先問是好方法。'],
          ['牠一定是在生氣',false,'△ 「一定」太快下結論了。'],
          ['牠一定不想和大家相處',false,'△ 這也是太快替對方決定想法。']
        ]
      },
      {
        q:'③ 問問看：怎麼確認比較尊重？',
        opts:[
          ['你還好嗎？需要我怎麼幫你？',true,'✓ 這樣能讓對方自己說出需要。'],
          ['你想告訴我發生什麼事嗎？',true,'✓ 很好，先聽再決定。'],
          ['你怎麼這麼奇怪？',false,'△ 這個問法容易讓對方不舒服。'],
          ['你一定又在生氣吧？',false,'△ 這是在替對方下結論。']
        ]
      },
      {
        q:'④ 行動：知道情況後，你會怎麼做？',
        opts:(sc.options||[]).map(o=>[o.text,!!o.correct,o.note||''])
      }
    ];
  }

  function pikminSvg(sc){
    try{
      if(typeof PIKMIN_SVGS!=='undefined' && PIKMIN_SVGS[sc.svgKey]) return PIKMIN_SVGS[sc.svgKey];
    }catch(e){}
    return '<div style="font-size:54px">🌱</div>';
  }

  function build(){
    const tab=document.getElementById('tab-empathy');
    if(!tab)return;
    const scenarios=getScenarios();
    if(sceneIndex>=scenarios.length) sceneIndex=0;
    const sc=scenarios[sceneIndex];
    const steps=genericSteps(sc);

    tab.innerHTML=`
      <section id="sel3-final-board">
        <div class="sel3-topbar">
          <button type="button" class="sel3-home-btn" id="sel3-home">🏠 回基地總部</button>
          <div class="sel3-scene-wrap">
            <div class="sel3-pikmin-art">${pikminSvg(sc)}</div>
            <div class="sel3-scene-text">
              <div class="sel3-scene-title">${sc.title}</div>
              <div class="sel3-scene-desc">${sc.desc}</div>
            </div>
            <div class="sel3-scene-count">情境 ${sceneIndex+1} / ${scenarios.length}</div>
          </div>
        </div>

        <div class="sel3-steps-row">
          <div class="sel3-step-head active"><div class="sel3-step-name">① 看見</div><div class="sel3-step-desc">只說看得到的事，不急著猜心情</div></div>
          <div class="sel3-step-head"><div class="sel3-step-name">② 猜想</div><div class="sel3-step-desc">想幾種可能，也可以說「我不知道」</div></div>
          <div class="sel3-step-head"><div class="sel3-step-name">③ 問問看</div><div class="sel3-step-desc">用尊重的方式確認對方真正的感受</div></div>
          <div class="sel3-step-head"><div class="sel3-step-name">④ 行動</div><div class="sel3-step-desc">知道需要後，再選擇合適的幫助</div></div>
        </div>

        <div class="sel3-columns">
          ${steps.map((st,i)=>`
            <div class="sel3-column ${i?'locked':''}" data-stage="${i}">
              <div class="sel3-question">${st.q}</div>
              <div class="sel3-options">
                ${st.opts.map(o=>`<button type="button" class="sel3-option" data-correct="${o[1]?'1':'0'}" data-note="${String(o[2]||'').replace(/"/g,'&quot;')}">${o[0]}</button>`).join('')}
              </div>
              <div class="sel3-feedback">請選一個答案。選擇後會保留在畫面上。</div>
            </div>`).join('')}
        </div>

        <div class="sel3-actions">
          <button type="button" class="sel3-restart" id="sel3-restart">🔄 重做本題</button>
          <button type="button" class="sel3-next" id="sel3-next">下一個皮克敏情境 ➜</button>
        </div>
      </section>`;

    document.getElementById('sel3-home').onclick=()=>{ if(typeof switchTab==='function') switchTab('home'); };
    document.getElementById('sel3-restart').onclick=()=>build();

    const cols=[...tab.querySelectorAll('.sel3-column')];
    const heads=[...tab.querySelectorAll('.sel3-step-head')];

    cols.forEach((col,i)=>{
      col.querySelectorAll('.sel3-option').forEach(btn=>{
        btn.addEventListener('click',()=>{
          if(col.classList.contains('locked') || col.dataset.answered==='1')return;
          col.dataset.answered='1';
          const ok=btn.dataset.correct==='1';
          col.querySelectorAll('.sel3-option').forEach(b=>b.disabled=true);
          btn.classList.add('selected',ok?'correct':'wrong');
          col.querySelector('.sel3-feedback').textContent=btn.dataset.note || (ok?'✓ 這個答案可以。':'△ 這個答案值得再想一想。');
          heads[i].classList.remove('active');
          heads[i].classList.add('done');
          if(i<3){
            cols[i+1].classList.remove('locked');
            heads[i+1].classList.add('active');
          }else{
            document.getElementById('sel3-next').classList.add('show');
          }
        });
      });
    });

    document.getElementById('sel3-next').onclick=()=>{
      sceneIndex=(sceneIndex+1)%scenarios.length;
      build();
    };

    if(typeof lucide!=='undefined' && lucide.createIcons) lucide.createIcons();
  }

  function initFinal(){
    build();
    const tab=document.getElementById('tab-empathy');
    if(tab){
      new MutationObserver(()=>{
        if(tab.offsetParent!==null && !document.getElementById('sel3-final-board')) build();
      }).observe(tab,{attributes:true,attributeFilter:['class','style']});
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initFinal);
  else setTimeout(initFinal,0);
})();
</script>
'''
          s += '\n'+js
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "SEL3 恢復皮克敏情境並完成四欄同理心介面"
          git push
