name: Patch SEL4 yellow Pikmin power

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect-sel4-yellow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect yellow Pikmin definitions
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          terms = ['yellow', '黃皮克敏', '黃色皮克敏', '黃色']
          found = False
          for term in terms:
              hits = list(re.finditer(term, s, re.I))
              if hits:
                  found = True
                  print(f'===== {term}: {len(hits)} hits =====')
                  for m in hits[:20]:
                      a=max(0,m.start()-500); b=min(len(s),m.end()+900)
                      print(s[a:b].replace('\n','\\n'))
                      print('---')
          if not found:
              raise SystemExit('找不到黃色皮克敏相關文字/代號')
