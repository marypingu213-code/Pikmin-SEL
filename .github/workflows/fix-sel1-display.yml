name: Fix SEL1 display size

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enlarge-sel1:
    if: ${{ !contains(github.event.head_commit.message, '強化 SEL1 學生操作版大介面') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enlarge SEL1 student workspace
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* SEL1_STUDENT_WORKSPACE_LARGE_20260914 */'
          if marker in s:
              print('SEL1 large workspace fix already applied')
              raise SystemExit(0)

          css = '''
          /* SEL1_STUDENT_WORKSPACE_LARGE_20260914 */
          /* SEL1 學生操作版：整個工作區放大，不影響列印版 */
          @media screen {
            #tab-self-card {
              width: 100% !important;
              max-width: none !important;
              font-size: 1.12rem !important;
            }

            /* 工作區左右欄拉開，增加可用空間 */
            #tab-self-card > .grid {
              width: 100% !important;
              max-width: none !important;
              gap: 2rem !important;
            }

            /* 所有卡片提高內距與圓角，讓學生更容易辨識操作區 */
            #tab-self-card .rounded-2xl,
            #tab-self-card .rounded-xl {
              border-radius: 1.25rem !important;
            }
            #tab-self-card .p-4 { padding: 1.25rem !important; }
            #tab-self-card .p-5 { padding: 1.5rem !important; }
            #tab-self-card .p-6 { padding: 1.75rem !important; }

            /* 文字層級整體放大 */
            #tab-self-card .text-xs {
              font-size: 1rem !important;
              line-height: 1.65 !important;
            }
            #tab-self-card .text-sm {
              font-size: 1.08rem !important;
              line-height: 1.65 !important;
            }
            #tab-self-card .text-base {
              font-size: 1.25rem !important;
              line-height: 1.55 !important;
            }
            #tab-self-card .text-lg {
              font-size: 1.45rem !important;
              line-height: 1.45 !important;
            }
            #tab-self-card .text-xl {
              font-size: 1.7rem !important;
              line-height: 1.35 !important;
            }
            #tab-self-card .text-2xl {
              font-size: 2rem !important;
              line-height: 1.3 !important;
            }
            #tab-self-card .text-3xl {
              font-size: 2.35rem !important;
              line-height: 1.25 !important;
            }

            /* 表單控制項：大按鈕、大輸入框、大觸控區 */
            #tab-self-card button,
            #tab-self-card input,
            #tab-self-card select,
            #tab-self-card textarea {
              font-size: 1.08rem !important;
            }
            #tab-self-card button {
              min-height: 50px !important;
              padding: 0.75rem 1rem !important;
            }
            #tab-self-card input,
            #tab-self-card select {
              min-height: 52px !important;
              padding: 0.75rem 1rem !important;
            }
            #tab-self-card textarea {
              min-height: 120px !important;
              padding: 0.9rem 1rem !important;
            }
            #tab-self-card label {
              font-size: 1.05rem !important;
              line-height: 1.55 !important;
            }

            /* 選項卡／皮克敏選擇區的觸控面積 */
            #tab-self-card [class*="cursor-pointer"] {
              min-height: 54px;
            }

            /* 屬性卡預覽在螢幕上明顯放大；列印尺寸完全不動 */
            #tab-self-card #physical-card-preview {
              transform: scale(1.12) !important;
              transform-origin: center top !important;
              margin-bottom: 2.5rem !important;
            }

            /* 預覽區不要被內容擠得太小 */
            #tab-self-card #physical-card-preview-wrap,
            #tab-self-card .physical-card-preview-wrap {
              min-height: 560px;
            }
          }

          @media screen and (max-width: 1024px) {
            #tab-self-card > .grid { gap: 1.25rem !important; }
            #tab-self-card .text-base { font-size: 1.15rem !important; }
            #tab-self-card .text-xl { font-size: 1.55rem !important; }
            #tab-self-card #physical-card-preview { transform: scale(1.06) !important; }
          }

          @media screen and (max-width: 640px) {
            #tab-self-card {
              font-size: 1.05rem !important;
            }
            #tab-self-card .p-4 { padding: 1rem !important; }
            #tab-self-card .p-5 { padding: 1.15rem !important; }
            #tab-self-card .text-xs { font-size: 0.95rem !important; }
            #tab-self-card .text-sm { font-size: 1rem !important; }
            #tab-self-card .text-base { font-size: 1.1rem !important; }
            #tab-self-card .text-xl { font-size: 1.4rem !important; }
            #tab-self-card button { min-height: 48px !important; }
            #tab-self-card input,
            #tab-self-card select { min-height: 50px !important; }
            #tab-self-card textarea { min-height: 110px !important; }
            #tab-self-card #physical-card-preview {
              transform: none !important;
              margin-bottom: 0 !important;
            }
            #tab-self-card #physical-card-preview-wrap,
            #tab-self-card .physical-card-preview-wrap {
              min-height: 0;
            }
          }
          '''
          style_end = s.find('</style>')
          if style_end < 0:
              raise SystemExit('style closing tag not found')
          s = s[:style_end] + css + '\n' + s[style_end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "強化 SEL1 學生操作版大介面"
          git push
