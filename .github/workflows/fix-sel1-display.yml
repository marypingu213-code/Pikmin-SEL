name: Patch SEL4 yellow Pikmin power

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-sel4-yellow-power:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch SEL4 yellow Pikmin to +2 power
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'SEL4_YELLOW_PIKMIN_POWER_2_20260914'
          if marker in s:
              print('SEL4 yellow Pikmin +2 power patch already present')
              raise SystemExit(0)

          # 1. 真正的 SEL4 闖關計分資料：黃色皮克敏從 +1 力改成 +2 力。
          old_map = "const PIKMIN_POWER_MAP = { red: 1, yellow: 1, purple: 10, rock: 3 };"
          new_map = "const PIKMIN_POWER_MAP = { red: 1, yellow: 2, purple: 10, rock: 3 };"
          if old_map not in s:
              raise SystemExit('找不到 PIKMIN_POWER_MAP，為避免誤改未提交。')
          s = s.replace(old_map, new_map, 1)

          # 2. SEL4 派遣按鈕的視覺提示同步改成 +2 力，
          #    讓學生在組合數字時能直接看見紅 1 / 黃 2 的差異。
          old_badge = '<span class="text-xs font-black text-amber-700 bg-white px-2.5 py-1 rounded-xl shadow-sm border border-amber-100">+1 力</span>'
          new_badge = '<span class="text-xs font-black text-amber-700 bg-white px-2.5 py-1 rounded-xl shadow-sm border border-amber-100">+2 力</span>'
          if old_badge not in s:
              raise SystemExit('找不到黃色皮克敏的 +1 力顯示，為避免誤改未提交。')
          s = s.replace(old_badge, new_badge, 1)

          # 3. 任務提示文字也明確告訴學生：紅色 +1、黃色 +2。
          s = s.replace(
              '💡 試試不同組合：大力量靠紫皮克敏、靈活調度靠紅黃皮克敏！',
              '💡 試試不同組合：紅色 +1 力、黃色 +2 力、紫色 +10 力！'
          , 1)

          style_end = s.find('</style>')
          if style_end >= 0:
              note = '''\n/* SEL4_YELLOW_PIKMIN_POWER_2_20260914 */\n/* SEL4 校園任務：黃色皮克敏固定為 +2 力，與紅色皮克敏 +1 力形成不同的數字組合。 */\n'''
              s = s[:style_end] + note + s[style_end:]

          p.write_text(s, encoding='utf-8')

      - name: Commit patched index.html
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "修正 SEL4 黃色皮克敏為 +2 力"
          git push
