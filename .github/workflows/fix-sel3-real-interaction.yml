name: Fix SEL3 Real Four-Stage Interaction
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace SEL3 with real four-stage interaction
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'SEL3_REAL_FOUR_STAGE_20260914'
          if marker in s:
              raise SystemExit(0)

          # Locate the existing SEL3 tab regardless of whether it is a div/section/main/etc.
          m = re.search(r'(<[^>]+id=["\']tab-empathy["\'][^>]*>)', s, re.I)
          if not m:
              raise SystemExit('找不到 SEL3 tab-empathy 容器')

          # Inject a real interactive replacement at the start of the existing SEL3 panel.
          block = r'''<!-- SEL3_REAL_FOUR_STAGE_20260914 -->
<div id="sel3-real-interaction" class="mt-4 rounded-3xl border-2 border-emerald-200 bg-white shadow-lg p-5 md:p-7">
  <div class="text-3xl md:text-4xl font-black text-emerald-800 mb-2">❤️ 同理心夥伴雷達｜四階段任務</div>
  <div class="text-xl md:text-2xl font-bold text-slate-700 leading-relaxed mb-5">
    <b>同理心不是猜對別人的心情。</b><br>我們可以：<b>先看見 → 再猜想 → 問問看 → 最後行動</b>
  </div>
  <div class="rounded-2xl bg-amber-50 border-2 border-amber-200 p-4 md:p-5 mb-5 text-xl md:text-2xl font-bold leading-relaxed">
    🌱 <b>小提醒：</b>不知道也沒關係！先觀察、再問問看，就是一種同理心。
  </div>
  <div id="sel3-stage-bar" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-6">
    <div data-s3-stage="0" class="s3-stage rounded-2xl p-3 text-center bg-emerald-100 text-emerald-900"><div class="text-2xl">👀</div><div class="text-lg md:text-xl font-black">① 看見</div></div>
    <div data-s3-stage="1" class="s3-stage rounded-2xl p-3 text-center bg-slate-100 text-slate-500"><div class="text-2xl">💭</div><div class="text-lg md:text-xl font-black">② 猜想</div></div>
    <div data-s3-stage="2" class="s3-stage rounded-2xl p-3 text-center bg-slate-100 text-slate-500"><div class="text-2xl">💬</div><div class="text-lg md:text-xl font-black">③ 問問看</div></div>
    <div data-s3-stage="3" class="s3-stage rounded-2xl p-3 text-center bg-slate-100 text-slate-500"><div class="text-2xl">🤝</div><div class="text-lg md:text-xl font-black">④ 行動</div></div>
  </div>
  <div class="rounded-3xl bg-slate-50 border border-slate-200 p-5 md:p-7">
    <div id="s3-progress" class="text-lg md:text-xl font-black text-slate-500 mb-2">第一步｜看見</div>
    <div id="s3-scenario" class="text-2xl md:text-3xl font-black text-slate-900 leading-relaxed mb-4">小美站在教室門口，其他同學正在一起玩。</div>
    <div id="s3-question" class="text-2xl md:text-3xl font-black text-emerald-800 leading-relaxed mb-5">你「看得到」哪些事情？</div>
    <div id="s3-options" class="grid gap-3"></div>
    <div id="s3-feedback" class="hidden mt-4 rounded-2xl p-4 text-xl md:text-2xl font-black leading-relaxed"></div>
  </div>
  <div id="s3-complete" class="hidden mt-5 rounded-3xl bg-emerald-50 border-2 border-emerald-300 p-6 text-center">
    <div class="text-3xl md:text-4xl font-black text-emerald-800 mb-3">🌟 同理心雷達完成！</div>
    <div class="text-xl md:text-2xl font-bold leading-relaxed">我先看見 → 我不急著猜 → 我可以問 → 我再決定怎麼幫忙</div>
    <button type="button" id="s3-restart" class="mt-5 px-7 py-4 rounded-2xl bg-emerald-600 text-white text-xl font-black">🔄 再玩一次</button>
  </div>
</div>
<script>
(function(){
  const root=document.getElementById('sel3-real-interaction');
  if(!root) return;
  const stages=[
    {name:'第一步｜看見',q:'你「看得到」哪些事情？',opts:[
      ['小美一個人站著','good'],['其他同學正在一起玩','good'],['小美沒有加入遊戲','good'],['小美一定很難過','bad']]},
    {name:'第二步｜猜想',q:'你覺得小美「可能」怎麼了？（可以有很多答案）',opts:[
      ['可能有點難過','good'],['可能有點害羞','good'],['可能只是想休息','good'],['我不知道，我想先問問看','best']]},
    {name:'第三步｜問問看',q:'你可以怎麼問小美？',opts:[
      ['你還好嗎？要不要跟我們一起玩？','best'],['你為什麼不跟大家玩？','okay'],['你一定是不開心吧？','bad'],['我想先問問你：你現在想做什麼？','best']]},
    {name:'第四步｜行動',q:'小美說：「我有點害怕，不知道怎麼加入。」你會怎麼做？',opts:[
      ['沒關係，我陪你一起。','best'],['你可以先看我們玩，想加入時再來。','best'],['那你自己去玩啊。','bad'],['我可以陪你一起想一個加入的方法。','best']]}
  ];
  let stage=0;
  function render(){
    const d=stages[stage];
    root.querySelector('#s3-progress').textContent=d.name;
    root.querySelector('#s3-question').textContent=d.q;
    const box=root.querySelector('#s3-options'); box.innerHTML='';
    root.querySelector('#s3-feedback').className='hidden';
    root.querySelectorAll('.s3-stage').forEach((el,i)=>{
      el.className='s3-stage rounded-2xl p-3 text-center '+(i===stage?'bg-emerald-100 text-emerald-900':'bg-slate-100 text-slate-500');
      if(i<stage) el.className='s3-stage rounded-2xl p-3 text-center bg-emerald-500 text-white';
    });
    d.opts.forEach(([text,kind])=>{
      const b=document.createElement('button'); b.type='button';
      b.className='w-full text-left rounded-2xl border-2 border-slate-200 bg-white px-5 py-4 text-xl md:text-2xl font-black leading-relaxed hover:border-emerald-400 active:scale-[.99] transition';
      b.textContent=text;
      b.onclick=()=>choose(kind,text);
      box.appendChild(b);
    });
  }
  function choose(kind,text){
    const f=root.querySelector('#s3-feedback');
    f.className='mt-4 rounded-2xl p-4 text-xl md:text-2xl font-black leading-relaxed';
    if(kind==='bad'){
      f.classList.add('bg-orange-50','text-orange-800');
      f.textContent=stage===0?'🌱 這是「猜想」，不是你直接看見的事情。換一個試試看！':'🌱 先停一下：這個做法可能太快替對方下結論了。想想看還有沒有更尊重的方式。';
      return;
    }
    f.classList.add('bg-emerald-50','text-emerald-800');
    if(stage===1) f.textContent='⭐ 很好！同一個情況可能有很多原因。就算不知道，也可以先問問看。';
    else if(stage===2) f.textContent=kind==='best'?'⭐ 很棒！這是尊重對方、先了解再行動的問法。':'👍 可以！注意不要替對方直接決定他的感受。';
    else if(stage===3) f.textContent='⭐ 很棒！先聽見對方，再用陪伴和支持來幫忙。';
    else f.textContent='⭐ 很棒！你選到的是可以直接從現場觀察到的資訊。';
    setTimeout(()=>{
      if(stage<3){ stage++; render(); }
      else{
        root.querySelector('#s3-options').innerHTML='';
        root.querySelector('#s3-progress').textContent='完成任務 🎉';
        root.querySelector('#s3-question').textContent='你已經完成真正的四階段同理心練習！';
        root.querySelector('#s3-complete').classList.remove('hidden');
        root.querySelectorAll('.s3-stage').forEach(el=>{el.className='s3-stage rounded-2xl p-3 text-center bg-emerald-500 text-white';});
      }
    },650);
  }
  root.querySelector('#s3-restart').onclick=()=>{stage=0;root.querySelector('#s3-complete').classList.add('hidden');render();};
  render();
})();
</script>
'''
          s = s[:m.end()] + block + s[m.end():]
          # Keep the original SEL3 available as source code, but hide it visually after our replacement.
          css = r'''<style>
#sel3-real-interaction .s3-stage{min-height:64px}
#sel3-real-interaction button:focus{outline:4px solid rgba(16,185,129,.25);outline-offset:2px}
#sel3-real-interaction button{min-height:68px}
</style>
'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patched index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "修正 SEL3 為真正四階段互動任務"
          git push
