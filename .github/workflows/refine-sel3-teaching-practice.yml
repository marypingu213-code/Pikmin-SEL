name: Refine SEL3 teaching practice
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SEL3
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'SEL3_LAYOUT_AND_PERSISTENT_ANSWERS_20260914'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)

          css = r'''\n<style id="sel3-refine-css">\n#sel3-refined{width:100%;max-width:1500px;margin:0 auto;font-family:inherit}\n#sel3-refined .sel3-shell{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);min-height:760px;height:calc(100vh - 120px);max-height:980px;border-radius:24px;overflow:hidden;box-shadow:0 10px 35px rgba(15,23,42,.10);background:#fff}\n#sel3-refined .sel3-teach{padding:26px 30px;background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border-bottom:1px solid #d1fae5;overflow:auto}\n#sel3-refined .sel3-practice{padding:20px 30px 28px;background:#fff;overflow:auto}\n#sel3-refined .sel3-scenario{font-size:clamp(20px,2.2vw,30px);font-weight:800;line-height:1.45;color:#0f172a;margin:0 0 14px}\n#sel3-refined .sel3-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}\n#sel3-refined .sel3-step{border:2px solid #cbd5e1;border-radius:14px;padding:9px 8px;text-align:center;font-weight:800;background:#fff;color:#64748b;font-size:clamp(13px,1.3vw,17px)}\n#sel3-refined .sel3-step.active{border-color:#10b981;background:#ecfdf5;color:#047857}\n#sel3-refined .sel3-step.done{border-color:#a7f3d0;background:#f0fdf4;color:#166534}\n#sel3-refined .sel3-title{font-size:clamp(22px,2.4vw,32px);font-weight:900;margin:0 0 8px;color:#0f172a}\n#sel3-refined .sel3-sub{font-size:clamp(16px,1.6vw,21px);line-height:1.6;color:#475569;margin:0}\n#sel3-refined .sel3-teach-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}\n#sel3-refined .sel3-teach-card{background:#fff;border:2px solid #d1fae5;border-radius:18px;padding:18px}\n#sel3-refined .sel3-teach-card b{display:block;font-size:18px;margin-bottom:6px;color:#047857}\n#sel3-refined .sel3-practice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}\n#sel3-refined .sel3-practice-label{font-size:clamp(20px,2vw,28px);font-weight:900;color:#0f172a}\n#sel3-refined .sel3-note{font-size:15px;color:#64748b}\n#sel3-refined .sel3-question{font-size:clamp(18px,1.8vw,24px);font-weight:900;margin:10px 0 10px;color:#1e293b}\n#sel3-refined .sel3-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n#sel3-refined .sel3-option{min-height:64px;border:3px solid #e2e8f0;border-radius:16px;background:#fff;padding:12px 16px;text-align:left;font-size:clamp(16px,1.55vw,21px);font-weight:700;cursor:pointer;transition:.18s;line-height:1.35}\n#sel3-refined .sel3-option:hover{transform:translateY(-1px);border-color:#6ee7b7}\n#sel3-refined .sel3-option.selected{border-color:#10b981;background:#ecfdf5;box-shadow:0 0 0 3px rgba(16,185,129,.12)}\n#sel3-refined .sel3-option.correct{border-color:#10b981}\n#sel3-refined .sel3-option.wrong{border-color:#f59e0b;background:#fffbeb}\n#sel3-refined .sel3-answer-record{display:none;margin:10px 0 4px;padding:11px 14px;border-radius:14px;background:#f8fafc;border:2px dashed #cbd5e1;font-size:16px;line-height:1.5}\n#sel3-refined .sel3-answer-record.show{display:block}\n#sel3-refined .sel3-feedback{min-height:28px;margin-top:8px;font-weight:800;font-size:16px;line-height:1.5}\n#sel3-refined .sel3-stage{padding:15px 0;border-top:2px solid #e2e8f0}\n#sel3-refined .sel3-stage:first-of-type{border-top:0}\n#sel3-refined .sel3-locked{opacity:.45;pointer-events:none;filter:saturate(.6)}\n#sel3-refined .sel3-complete{display:none;margin-top:14px;padding:16px;border-radius:18px;background:#ecfdf5;border:2px solid #86efac;font-size:18px;line-height:1.6}\n#sel3-refined .sel3-complete.show{display:block}\n@media(max-width:800px){#sel3-refined .sel3-shell{height:auto;min-height:0;display:block;max-height:none}#sel3-refined .sel3-teach,#sel3-refined .sel3-practice{height:auto;min-height:360px;padding:20px 18px}.sel3-teach-grid{grid-template-columns:1fr!important}.sel3-options{grid-template-columns:1fr!important}.sel3-progress{gap:5px}.sel3-step{padding:8px 4px}}\n@media(min-width:1200px){#sel3-refined .sel3-shell{grid-template-rows:1fr 1fr}}\n</style>\n'''

          js = r'''\n<!-- SEL3_LAYOUT_AND_PERSISTENT_ANSWERS_20260914 -->\n<script>\n(function(){\n  function init(){\n    const tab=document.getElementById('tab-empathy');\n    if(!tab || tab.dataset.sel3Refined==='1') return;\n    tab.dataset.sel3Refined='1';\n    tab.innerHTML=`\n      <section id="sel3-refined" aria-label="SEL3 同理心夥伴雷達">\n        <div class="sel3-shell">\n          <div class="sel3-teach">\n            <div class="sel3-scenario">情境：小美站在教室門口，其他同學正在一起玩。</div>\n            <div class="sel3-progress" aria-label="四階段進度">\n              <div class="sel3-step active" data-step="1">① 看見</div>\n              <div class="sel3-step" data-step="2">② 猜想</div>\n              <div class="sel3-step" data-step="3">③ 問問看</div>\n              <div class="sel3-step" data-step="4">④ 行動</div>\n            </div>\n            <h2 class="sel3-title">同理心不是猜對別人的心情</h2>\n            <p class="sel3-sub">我們可以：先看見 → 再猜想 → 問問看 → 最後行動。<br>不知道也沒關係！先觀察、再問問看，也是一種同理心。</p>\n            <div class="sel3-teach-grid">\n              <div class="sel3-teach-card"><b>① 看見｜找「真的看得到」的事</b>不要急著替別人下結論，只說你觀察到的行為或情況。</div>\n              <div class="sel3-teach-card"><b>② 猜想｜接受不只一種可能</b>別人的心情不能只靠猜；「我不知道」也是很好的答案。</div>\n              <div class="sel3-teach-card"><b>③ 問問看｜用尊重的方式確認</b>用「你還好嗎？」這類問題，而不是直接替對方決定感受。</div>\n              <div class="sel3-teach-card"><b>④ 行動｜知道後再決定怎麼幫</b>聽到對方的需要，再選擇陪伴、邀請或其他合適的行動。</div>\n            </div>\n          </div>\n          <div class="sel3-practice">\n            <div class="sel3-practice-head"><div class="sel3-practice-label">🧭 同理心練習</div><div class="sel3-note">你的每一步答案都會留下來，方便老師一起檢討</div></div>\n            <div id="sel3-stage-1" class="sel3-stage">\n              <div class="sel3-question">① 看見：你看到了什麼？</div>\n              <div class="sel3-options">\n                <button class="sel3-option" data-stage="1" data-correct="1">小美一個人站著</button>\n                <button class="sel3-option" data-stage="1" data-correct="1">同學正在一起玩</button>\n                <button class="sel3-option" data-stage="1" data-correct="1">小美沒有加入</button>\n                <button class="sel3-option" data-stage="1" data-correct="0">小美一定很難過</button>\n              </div><div class="sel3-feedback"></div>\n            </div>\n            <div id="sel3-stage-2" class="sel3-stage sel3-locked">\n              <div class="sel3-question">② 猜想：你覺得她可能怎麼了？</div>\n              <div class="sel3-options">\n                <button class="sel3-option" data-stage="2" data-correct="1">可能有點難過</button>\n                <button class="sel3-option" data-stage="2" data-correct="1">可能有點害羞</button>\n                <button class="sel3-option" data-stage="2" data-correct="1">可能只是想休息</button>\n                <button class="sel3-option" data-stage="2" data-correct="1">我不知道，我想先問問看</button>\n              </div><div class="sel3-feedback"></div>\n            </div>\n            <div id="sel3-stage-3" class="sel3-stage sel3-locked">\n              <div class="sel3-question">③ 問問看：你可以怎麼問？</div>\n              <div class="sel3-options">\n                <button class="sel3-option" data-stage="3" data-correct="1">你還好嗎？</button>\n                <button class="sel3-option" data-stage="3" data-correct="1">你想跟我們一起玩嗎？</button>\n                <button class="sel3-option" data-stage="3" data-correct="0">你為什麼不跟大家玩？</button>\n                <button class="sel3-option" data-stage="3" data-correct="0">你一定是不開心吧？</button>\n              </div><div class="sel3-feedback"></div>\n            </div>\n            <div id="sel3-stage-4" class="sel3-stage sel3-locked">\n              <div class="sel3-question">④ 行動：小美說「我有點害怕，不知道怎麼加入。」你會怎麼做？</div>\n              <div class="sel3-options">\n                <button class="sel3-option" data-stage="4" data-correct="1">沒關係，我陪你一起。</button>\n                <button class="sel3-option" data-stage="4" data-correct="1">你可以先看我們玩。</button>\n                <button class="sel3-option" data-stage="4" data-correct="0">那你自己去玩啊。</button>\n                <button class="sel3-option" data-stage="4" data-correct="0">我去找老師。</button>\n              </div><div class="sel3-feedback"></div>\n            </div>\n            <div id="sel3-complete" class="sel3-complete"><b>🌟 同理心雷達完成！</b><br>我先看見 → 我不急著猜 → 我可以問 → 我再決定怎麼幫忙。<br><span style="font-size:15px">老師可以回頭看四個步驟的答案，帶著大家一起討論「為什麼這樣選？」</span></div>\n          </div>\n        </div>\n      </section>`;\n\n    const steps=[1,2,3,4].map(n=>document.getElementById('sel3-stage-'+n));\n    const progress=[...tab.querySelectorAll('.sel3-step')];\n    tab.querySelectorAll('.sel3-option').forEach(btn=>{\n      btn.addEventListener('click',function(){\n        const n=Number(this.dataset.stage), stage=steps[n-1];\n        if(stage.classList.contains('sel3-locked')) return;\n        const buttons=stage.querySelectorAll('.sel3-option');\n        buttons.forEach(b=>b.classList.remove('selected','correct','wrong'));\n        this.classList.add('selected');\n        const fb=stage.querySelector('.sel3-feedback');\n        const ok=this.dataset.correct==='1';\n        if(ok){\n          this.classList.add('correct');\n          fb.textContent=n===2 ? '✓ 很好！這是「可能」的想法，不必急著確定。' : n===3 ? '✓ 很好！先問問看，才能知道對方真正的感受。' : n===4 ? '✓ 很好！先理解需要，再用行動支持對方。' : '✓ 這是看得到的事實。觀察得很仔細！';\n          progress[n-1].classList.remove('active'); progress[n-1].classList.add('done');\n          if(n<4){\n            const next=steps[n];\n            next.classList.remove('sel3-locked');\n            progress[n].classList.add('active');\n            setTimeout(()=>next.scrollIntoView({behavior:'smooth',block:'nearest'}),150);\n          }else{\n            document.getElementById('sel3-complete').classList.add('show');\n          }\n        }else{\n          this.classList.add('wrong');\n          fb.textContent=n===1 ? '再想想：這句話是在猜心情，不是你真正看得到的事情。' : '再想想：這個選擇太快替對方下結論或不夠支持，可以換一個看看。';\n        }\n      });\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();\n})();\n</script>\n'''
          s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('SEL3 refined')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "SEL3 上下區塊等高並保留四階段答案"
          git push