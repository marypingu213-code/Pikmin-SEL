name: SEL3 four column interaction
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild SEL3 as four columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='SEL3_FOUR_COLUMNS_20260914'
          if marker in s:
              raise SystemExit(0)
          css=r'''
          <style id="sel3-four-columns-css">
          #sel3-four-columns{width:100%;height:calc(100vh - 145px);min-height:600px;padding:10px 16px 18px;box-sizing:border-box;overflow:hidden}
          .s3fc-wrap{height:100%;display:grid;grid-template-rows:39% 61%;gap:12px}
          .s3fc-top{min-height:0;border:3px solid #bfdbfe;border-radius:22px;background:linear-gradient(135deg,#eff6ff,#fff);padding:12px 14px;box-sizing:border-box;overflow:hidden}
          .s3fc-scenario{font-size:clamp(19px,1.8vw,27px);font-weight:900;color:#1e3a8a;background:#dbeafe;border-radius:14px;padding:8px 14px;margin-bottom:8px;text-align:center}
          .s3fc-title{font-size:clamp(20px,2vw,29px);font-weight:900;color:#172554;text-align:center;margin:2px 0 8px}
          .s3fc-lessons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;height:calc(100% - 76px)}
          .s3fc-lesson{border:3px solid #cbd5e1;border-radius:17px;background:#fff;padding:9px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box}
          .s3fc-lesson.active{border-color:#2563eb;background:#eff6ff}.s3fc-lesson.done{border-color:#22c55e;background:#f0fdf4}
          .s3fc-lesson-num{font-size:clamp(19px,1.7vw,25px);font-weight:900;color:#1d4ed8;margin-bottom:4px}
          .s3fc-lesson-name{font-size:clamp(18px,1.6vw,23px);font-weight:900;color:#0f172a;margin-bottom:5px}
          .s3fc-lesson-text{font-size:clamp(14px,1.2vw,17px);font-weight:700;line-height:1.4;color:#475569}
          .s3fc-bottom{min-height:0;border:3px solid #fed7aa;border-radius:22px;background:linear-gradient(135deg,#fff7ed,#fff);padding:10px 12px;box-sizing:border-box;overflow:hidden}
          .s3fc-practice-title{font-size:clamp(21px,2vw,28px);font-weight:900;color:#9a3412;text-align:center;margin:0 0 7px}
          .s3fc-columns{height:calc(100% - 40px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
          .s3fc-stage{min-width:0;border:3px solid #fed7aa;border-radius:18px;background:#fff;padding:9px;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;transition:.15s}
          .s3fc-stage.locked{opacity:.55}
          .s3fc-stage-head{font-size:clamp(17px,1.45vw,21px);font-weight:900;color:#7c2d12;text-align:center;line-height:1.25;margin-bottom:7px}
          .s3fc-options{display:flex;flex-direction:column;gap:6px;flex:1;justify-content:flex-start}
          .s3fc-option{width:100%;min-height:47px;border:3px solid #e2e8f0;border-radius:13px;background:#f8fafc;padding:7px 9px;text-align:left;font-size:clamp(14px,1.15vw,17px);font-weight:800;color:#1e293b;cursor:pointer;transition:.12s;box-sizing:border-box}
          .s3fc-option:hover:not(:disabled){transform:translateY(-1px);border-color:#60a5fa;background:#eff6ff}
          .s3fc-option.selected{box-shadow:0 0 0 3px #facc15}.s3fc-option.correct{border-color:#22c55e;background:#dcfce7}.s3fc-option.wrong{border-color:#f97316;background:#ffedd5}
          .s3fc-option:disabled{cursor:default}
          .s3fc-feedback{min-height:34px;margin-top:6px;padding:5px 6px;border-radius:10px;background:#f8fafc;font-size:13px;font-weight:800;line-height:1.3;color:#475569}
          .s3fc-tip{font-size:12px;color:#64748b;text-align:center;margin-top:5px;font-weight:700}
          @media(max-width:900px){#sel3-four-columns{height:auto;min-height:0;overflow:visible}.s3fc-wrap{grid-template-rows:auto auto}.s3fc-top,.s3fc-bottom{overflow:visible}.s3fc-lessons,.s3fc-columns{height:auto;grid-template-columns:repeat(2,1fr)}.s3fc-stage{min-height:360px}}
          </style>
          '''
          s=s.replace('</head>',css+'</head>',1)
          js=r'''
          <script>
          (function(){
            function buildSEL3FourColumns(){
              const tab=document.getElementById('tab-empathy');
              if(!tab)return;
              tab.innerHTML=`
              <section id="sel3-four-columns">
                <div class="s3fc-wrap">
                  <div class="s3fc-top">
                    <div class="s3fc-scenario">情境：小美站在教室門口，其他同學正在一起玩。</div>
                    <div class="s3fc-title">同理心四步驟：先看見，再理解，最後行動</div>
                    <div class="s3fc-lessons">
                      <div class="s3fc-lesson active"><div class="s3fc-lesson-num">①</div><div class="s3fc-lesson-name">看見</div><div class="s3fc-lesson-text">找「真的看得到」的事情，不急著猜心情。</div></div>
                      <div class="s3fc-lesson"><div class="s3fc-lesson-num">②</div><div class="s3fc-lesson-name">猜想</div><div class="s3fc-lesson-text">想想可能性，也可以說「我不知道」。</div></div>
                      <div class="s3fc-lesson"><div class="s3fc-lesson-num">③</div><div class="s3fc-lesson-name">問問看</div><div class="s3fc-lesson-text">用尊重的問題，確認對方真正的想法。</div></div>
                      <div class="s3fc-lesson"><div class="s3fc-lesson-num">④</div><div class="s3fc-lesson-name">行動</div><div class="s3fc-lesson-text">知道對方需要後，再選擇合適的幫助。</div></div>
                    </div>
                  </div>
                  <div class="s3fc-bottom">
                    <div class="s3fc-practice-title">🧭 同理心練習｜四個階段一起看、一起選</div>
                    <div class="s3fc-columns">
                      <div class="s3fc-stage" data-stage="0"><div class="s3fc-stage-head">① 看見<br>你看到了什麼？</div><div class="s3fc-options">
                        <button class="s3fc-option" data-correct="1">小美一個人站著</button>
                        <button class="s3fc-option" data-correct="1">同學正在一起玩</button>
                        <button class="s3fc-option" data-correct="1">小美沒有加入</button>
                        <button class="s3fc-option" data-correct="0">小美一定很難過</button>
                      </div><div class="s3fc-feedback">請選一個答案。</div><div class="s3fc-tip">選過的答案會留下來</div></div>
                      <div class="s3fc-stage locked" data-stage="1"><div class="s3fc-stage-head">② 猜想<br>她可能怎麼了？</div><div class="s3fc-options">
                        <button class="s3fc-option" data-correct="1">可能有點難過</button>
                        <button class="s3fc-option" data-correct="1">可能有點害羞</button>
                        <button class="s3fc-option" data-correct="1">可能只是想休息</button>
                        <button class="s3fc-option" data-correct="1">我不知道，我想先問問看</button>
                      </div><div class="s3fc-feedback">完成①後就可以選。</div><div class="s3fc-tip">不同猜想都可以討論</div></div>
                      <div class="s3fc-stage locked" data-stage="2"><div class="s3fc-stage-head">③ 問問看<br>你可以怎麼問？</div><div class="s3fc-options">
                        <button class="s3fc-option" data-correct="1">你還好嗎？</button>
                        <button class="s3fc-option" data-correct="1">你想跟我們一起玩嗎？</button>
                        <button class="s3fc-option" data-correct="0">你為什麼不跟大家玩？</button>
                        <button class="s3fc-option" data-correct="0">你一定是不開心吧？</button>
                      </div><div class="s3fc-feedback">完成②後就可以選。</div><div class="s3fc-tip">想想看：哪一句比較尊重？</div></div>
                      <div class="s3fc-stage locked" data-stage="3"><div class="s3fc-stage-head">④ 行動<br>你會怎麼做？</div><div class="s3fc-options">
                        <button class="s3fc-option" data-correct="1">沒關係，我陪你一起。</button>
                        <button class="s3fc-option" data-correct="1">你可以先看我們玩。</button>
                        <button class="s3fc-option" data-correct="0">那你自己去玩啊。</button>
                        <button class="s3fc-option" data-correct="0">我去找老師。</button>
                      </div><div class="s3fc-feedback">完成③後就可以選。</div><div class="s3fc-tip">選擇後一起討論原因</div></div>
                    </div>
                  </div>
                </div>
              </section>`;
              const stages=[...tab.querySelectorAll('.s3fc-stage')];
              const lessons=[...tab.querySelectorAll('.s3fc-lesson')];
              stages.forEach((stage,i)=>stage.querySelectorAll('.s3fc-option').forEach(btn=>btn.addEventListener('click',()=>{
                if(stage.classList.contains('locked')||stage.dataset.answered==='1')return;
                stage.dataset.answered='1';
                const ok=btn.dataset.correct==='1';
                stage.querySelectorAll('.s3fc-option').forEach(b=>b.disabled=true);
                btn.classList.add('selected',ok?'correct':'wrong');
                stage.querySelector('.s3fc-feedback').textContent=ok?'✓ 你選的答案留下來了，可以和老師一起討論。':'△ 這個答案也留下來！想想看，為什麼它可能不是最適合的？';
                lessons[i].classList.remove('active'); lessons[i].classList.add('done');
                if(stages[i+1]){stages[i+1].classList.remove('locked');lessons[i+1].classList.add('active');stages[i+1].querySelector('.s3fc-feedback').textContent='可以選答案了！';}
                else{stage.querySelector('.s3fc-feedback').textContent=ok?'🌟 四步完成！所有答案都留下來了。':'🌟 四步完成！這個答案也留下來，現在可以一起檢討。';}
              })));
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',buildSEL3FourColumns);else setTimeout(buildSEL3FourColumns,0);
          })();
          </script>
          '''
          s+='\n<!-- '+marker+' -->\n'+js
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "SEL3 四階段改為同頁四欄直立選擇"
          git push
